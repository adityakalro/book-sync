<div class="eyebrow">Connections</div>
<h1>Connect your services</h1>
<p class="intro">Connect the services you use. Sync needs a verified book match and saved positions on at least two readers.</p>
<p class="muted" id="setupStatus" role="status">Checking saved connections…</p>
<div id="services"></div>
<footer>Connections apply to this installation. Manage remote device grants in the provider’s account settings.</footer>
</main>
<script nonce="NONCE">
const csrf='CSRF';
const panels=new Map();
const element=(tag,text='',className='')=>{
  const node=document.createElement(tag);
  node.textContent=text;
  node.className=className;
  return node;
};
async function call(path,body){
  const response=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-Book-Sync':csrf}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  const result=await response.json();
  if(!response.ok)throw Error(result.error||'Connection failed');
  return result;
}
function showInstructions(panel,result){
  panel.instructions.replaceChildren();
  const code=result.code||result.user_code;
  if(code)panel.instructions.append(element('p',code,'code'));
  const address=result.link||result.login_url||result.verification_uri_complete;
  if(address){
    const url=new URL(address);
    if(url.protocol!=='https:')throw Error('Invalid sign-in link.');
    const link=element('a',result.link_label||'Open provider approval');
    link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';
    panel.instructions.append(link);
  }
  if(result.message)panel.instructions.append(element('p',result.message,'muted'));
}
async function act(panel,button,action,data){
  button.disabled=true;
  panel.message.textContent='Working…';panel.message.classList.remove('error');
  try{
    const result=await call('/api/setup',{...data,service:panel.key,action});
    panel.message.textContent=result.connected===true?'Connected.':action==='disconnect'?'Disconnected.':'';
    showInstructions(panel,result);
    panel.completed=action==='disconnect'||result.connected?null:action;
    await refresh();
  }catch(error){
    panel.message.textContent=error.message;panel.message.classList.add('error');
  }finally{button.disabled=false}
}
function actionForm(panel,spec){
  const form=element('form');
  for(const field of spec.fields||[]){
    const label=element('label',field.label);
    const input=element('input');
    input.name=field.name;
    input.type=['text','password','url'].includes(field.type)?field.type:'text';
    input.autocomplete=input.type==='password'?'current-password':'off';
    input.required=true;label.append(input);form.append(label);
  }
  if(!spec.after){
    const label=element('label',spec.consent||'Allow Book Sync to save access to this account.','check');
    const consent=element('input');consent.type='checkbox';consent.name='consent';consent.required=true;
    label.prepend(consent);form.append(label);
  }
  const button=element('button',spec.label,'primary secondary');
  form.append(button);
  form.onsubmit=event=>{
    event.preventDefault();
    const data=Object.fromEntries(new FormData(form));
    data.consent=data.consent==='on';
    act(panel,button,spec.id,data).then(()=>{
      for(const input of form.querySelectorAll('input[type=password],input[type=url]'))input.value='';
    });
  };
  return {form,spec};
}
function createPanel(key,service){
  const card=element('section','','card');
  card.dataset.service=key;
  const title=element('div','','service-title');
  const state=element('span','','service-state');
  title.append(element('h2',service.label),state);
  const panel={key,state,completed:null,instructions:element('div'),message:element('p','','muted setup-feedback')};
  panel.message.setAttribute('role','status');
  const disconnect=element('button','Disconnect','primary secondary');
  disconnect.onclick=()=>{
    if(window.confirm('Disconnect this service from Book Sync?'))act(panel,disconnect,'disconnect',{confirm:true});
  };
  panel.disconnect=disconnect;
  panel.forms=(service.actions||[]).map(spec=>actionForm(panel,spec));
  card.append(title,element('p',service.description,'muted'),panel.instructions,
              ...panel.forms.map(item=>item.form),disconnect,panel.message);
  document.getElementById('services').append(card);
  return panel;
}
async function refresh(){
  const status=await call('/api/status');
  for(const [key,service] of Object.entries(status.services)){
    if(!panels.has(key))panels.set(key,createPanel(key,service));
    const panel=panels.get(key);
    panel.state.textContent=service.connected?'Connected':'Not connected';
    panel.disconnect.hidden=!service.can_disconnect;
    panel.disconnect.textContent=service.connected?'Disconnect':'Reset setup';
    for(const {form,spec} of panel.forms)
      form.hidden=service.connected||Boolean(spec.after&&spec.after!==panel.completed);
  }
  document.getElementById('setupStatus').textContent=status.running?'A sync is running.':status.connected?'Ready to sync.':'Connect two readers and a book catalog.';
}
refresh().catch(error=>{document.getElementById('setupStatus').textContent=error.message});
</script></html>
